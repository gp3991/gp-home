<style>

.b3{left:calc(50% - 230px);top:calc(50% - 470px);width:480px;height:480px;background:radial-gradient(closest-side,rgba(236,72,153,1) 0%,rgba(236,72,153,0.86) 15%,rgba(236,72,153,0.66) 30%,rgba(236,72,153,0.46) 45%,rgba(236,72,153,0.28) 60%,rgba(236,72,153,0.13) 75%,rgba(236,72,153,0.04) 88%,rgba(236,72,153,0) 100%);opacity:.35;animation:drift3 18s ease-in-out infinite alternate}

.stage{position:fixed;inset:0;display:grid;place-items:center;perspective:900px;pointer-events:none}
.card{pointer-events:auto;position:relative;width:min(480px,calc(100vw - 32px));box-sizing:border-box;padding:0 0 26px;border-radius:40px;overflow:hidden;
background:rgba(255,255,255,.07);

box-shadow:inset 0 1.5px 0 rgba(255,255,255,.75),inset 1px 0 0 rgba(255,255,255,.22),inset -1px 0 0 rgba(255,255,255,.12),inset 0 -1px 0 rgba(255,255,255,.18),inset 0 0 32px rgba(255,255,255,.06),0 40px 100px rgba(0,0,0,.55);
transition:transform .15s ease-out;will-change:transform}

background:radial-gradient(120% 60% at var(--mx,20%) var(--my,0%),rgba(255,255,255,.28),transparent 55%)}

.x{background:#ff5f57}.m{background:#febc2e}.f{background:#28c840}
.card{transition:transform .15s ease-out,width .45s cubic-bezier(.2,.8,.2,1),min-height .45s cubic-bezier(.2,.8,.2,1),border-radius .45s,padding .3s}

background:rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -1px 0 rgba(255,255,255,.12),0 8px 20px rgba(0,0,0,.25);}

<script>
(function(){
var CONFIG={
name:'Piotr Gościniak',
tagline:'Software developer',
mail:'you@example.com',
phone:'+48000000000',
linkedin:'https://www.linkedin.com/in/your-handle',
github:'https://github.com/your-handle'
};
var links={mail:'mailto:'+CONFIG.mail,phone:'tel:'+CONFIG.phone,linkedin:CONFIG.linkedin,github:CONFIG.github};
document.getElementById('name').textContent=CONFIG.name;
document.getElementById('tag').textContent=CONFIG.tagline;
var btns=[].slice.call(document.querySelectorAll('[data-k]'));
btns.forEach(function(a){
var k=a.getAttribute('data-k');
a.href=links[k];
if(k==='linkedin'||k==='github'){a.target='_blank';a.rel='noopener noreferrer'}
});

var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
var card=document.getElementById('card');

// Intro: type the command, fade the buttons in one by one, then show a fresh prompt.
var CMD='ls ./contact';
var cmdEl=document.getElementById('cmd'),caret=document.getElementById('caret'),promptEl=document.getElementById('prompt');
function finish(){
cmdEl.textContent=CMD;caret.style.display='none';
btns.forEach(function(a){a.classList.add('in')});
promptEl.classList.add('on');
}
if(reduce)finish();
else{
var t=700;
CMD.split('').forEach(function(_,i){
t+=55+Math.random()*70;
setTimeout(function(){cmdEl.textContent=CMD.slice(0,i+1)},t);
});
t+=380;
setTimeout(function(){caret.style.display='none'},t);
btns.forEach(function(a){t+=170;setTimeout(function(){a.classList.add('in')},t)});
setTimeout(function(){promptEl.classList.add('on')},t+650);
}

// Traffic lights: red closes for good (refresh to get it back), yellow folds the window down to its title bar and contact buttons, green goes full screen.
function pop(){
if(reduce)return;
card.classList.remove('pop');void card.offsetWidth;card.classList.add('pop');
}
document.querySelectorAll('[data-w]').forEach(function(b){
b.addEventListener('click',function(e){
e.stopPropagation();
var w=b.getAttribute('data-w');
card.style.transform='';
if(w==='close'){card.classList.add('closed');return}
if(w==='min'){card.classList.remove('max');card.classList.toggle('min')}
else{card.classList.remove('min');card.classList.toggle('max');pop()}
});
});
document.addEventListener('keydown',function(e){
if(e.key!=='Escape'||!(card.classList.contains('min')||card.classList.contains('max')))return;
card.classList.remove('min','max');
});

var cv=document.getElementById('bg'),ctx=cv.getContext('2d',{alpha:false});
var maxObjs=45;
var W=0,H=0,mouse={x:-1e4,y:-1e4};
var BG='#070a14';
var TOK=['<?php','$this->','namespace','->','=>','::class','composer','PHP 8.4','SELECT *','JOIN','WHERE','INSERT','GROUP BY','INDEX','COMMIT','NULL','EXPLAIN','Symfony','Doctrine','#[Route]','Twig','bin/console','kubectl','pod','helm','k8s','deploy','YAML','Docker','nginx','sudo','chmod 777','ssh','grep','|','~/.bashrc','rm -rf /','tail -f','cron','systemctl','uptime','root@srv','404','502','/var/log','apt','curl','0x1F','$_POST','ORDER BY'];
var COL=['#8ab4ff','#c4a7ff','#e8eeff'];
var CODE=['#[Route("/api")]','public function index()','return $this->json($x);','$em->flush();','SELECT * FROM users','WHERE id = 1;','LEFT JOIN orders o','kubectl get pods -A','CrashLoopBackOff','replicas: 3','ssh root@prod','tail -f error.log','sudo systemctl restart','composer install','bin/console cache:clear','docker compose up -d'];
var objs=[],nextId=0,DPR=1,cache={},cacheN=0;
function rnd(a,b){return a+Math.random()*(b-a)}
function pick(a){return a[Math.random()*a.length|0]}

function Obj(){
var win=Math.random()<.14;
this.win=win;
this.col=pick(COL);
this.id=nextId++;
this.size=win?10:Math.round(rnd(13,30));
// Depth: small tokens sit further back, so they are dimmer and glow less.
this.alpha=win?.55:.25+(this.size-13)/17*.65;
this.text=pick(TOK);
this.lines=[pick(CODE),pick(CODE),pick(CODE)];
if(win)this.r=62;
else{ctx.font=this.size+'px monospace';this.r=Math.max(this.size*.7,ctx.measureText(this.text).width/2)}
this.x=rnd(this.r,Math.max(this.r+1,W-this.r));
this.y=rnd(this.r,Math.max(this.r+1,H-this.r));
var a=rnd(0,6.283),s=rnd(1.2,4)*(reduce?.35:1);
this.vx=Math.cos(a)*s;this.vy=Math.sin(a)*s;
this.rot=rnd(0,6.283);this.vr=rnd(-.03,.03);
this.g=0;
}

// Text with shadowBlur is expensive to draw every frame (notably in Firefox),
// so each token and code window is rendered once into a small canvas and reused.
function sprite(o){
var key=o.win?'w'+o.id:o.text+'|'+o.size+'|'+o.col;
var sp=cache[key];
if(sp)return sp;
if(cacheN>400){cache={};cacheN=0}
var c=document.createElement('canvas'),x=c.getContext('2d'),w,h,k;
if(o.win){w=144;h=76}
else{
x.font=o.size+'px monospace';
var pad=Math.ceil(o.alpha*16)+2;
w=Math.ceil(x.measureText(o.text).width)+pad*2;h=Math.ceil(o.size*1.4)+pad*2;
}
c.width=Math.ceil(w*DPR);c.height=Math.ceil(h*DPR);
x.scale(DPR,DPR);x.translate(w/2,h/2);
x.fillStyle=x.strokeStyle=o.col;
if(o.win){
x.lineWidth=1;x.beginPath();
if(x.roundRect)x.roundRect(-70,-36,140,72,10);else x.rect(-70,-36,140,72);
x.stroke();
for(k=0;k<3;k++){x.beginPath();x.arc(-58+k*10,-26,2.5,0,6.283);x.fill()}
x.font='9px monospace';x.textAlign='left';x.textBaseline='middle';
for(k=0;k<3;k++)x.fillText(o.lines[k],-62,-10+k*15);
}else{
x.font=o.size+'px monospace';x.textAlign='center';x.textBaseline='middle';
x.shadowColor=o.col;x.shadowBlur=o.alpha*16;
x.fillText(o.text,0,0);
}
sp={c:c,w:w,h:h};cache[key]=sp;cacheN++;
return sp;
}

function resize(){
var dpr=Math.min(window.devicePixelRatio||1,2);
if(dpr!==DPR){DPR=dpr;cache={};cacheN=0}
W=window.innerWidth;H=window.innerHeight;
cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
ctx.setTransform(dpr,0,0,dpr,0,0);
ctx.fillStyle=BG;ctx.fillRect(0,0,W,H);
var want=reduce?15:Math.min(maxObjs,Math.round(W*H/28000)+10);
while(objs.length<want)objs.push(new Obj());
objs.length=want;
objs.forEach(function(o){
o.x=Math.min(Math.max(o.x,o.r),Math.max(o.r,W-o.r));
o.y=Math.min(Math.max(o.y,o.r),Math.max(o.r,H-o.r));
});
}

function step(dt){
var i,j,o,p;
for(i=0;i<objs.length;i++){
o=objs[i];
var dx=o.x-mouse.x,dy=o.y-mouse.y,d=Math.sqrt(dx*dx+dy*dy);
if(d<150&&d>0){var f=(150-d)/150*.9;o.vx+=dx/d*f;o.vy+=dy/d*f}
o.x+=o.vx*dt;o.y+=o.vy*dt;o.rot+=o.vr*dt;
if(o.x<o.r){o.x=o.r;o.vx=Math.abs(o.vx)}
if(o.x>W-o.r){o.x=Math.max(o.r,W-o.r);o.vx=-Math.abs(o.vx)}
if(o.y<o.r){o.y=o.r;o.vy=Math.abs(o.vy)}
if(o.y>H-o.r){o.y=Math.max(o.r,H-o.r);o.vy=-Math.abs(o.vy)}
var sp=Math.sqrt(o.vx*o.vx+o.vy*o.vy),cap=reduce?3:9;
if(sp>cap){o.vx*=cap/sp;o.vy*=cap/sp}
else if(sp<1){o.vx+=rnd(-1,1);o.vy+=rnd(-1,1)}
else{o.vx*=.9995;o.vy*=.9995}
if(o.g>0)o.g--;
else if(!reduce&&Math.random()<.004){
o.g=8;
if(!o.win)o.text=Math.random()<.5?pick(TOK):o.text.replace(/[01]/g,function(c){return c==='0'?'1':'0'});
}
}
for(i=0;i<objs.length;i++){
for(j=i+1;j<objs.length;j++){
o=objs[i];p=objs[j];
var cx=p.x-o.x,cy=p.y-o.y,dist=Math.sqrt(cx*cx+cy*cy),min=o.r+p.r;
if(dist<min&&dist>0){
var nx=cx/dist,ny=cy/dist,push=(min-dist)/2;
o.x-=nx*push;o.y-=ny*push;p.x+=nx*push;p.y+=ny*push;
var dvn=(o.vx-p.vx)*nx+(o.vy-p.vy)*ny;
if(dvn>0){
o.vx-=dvn*nx;o.vy-=dvn*ny;p.vx+=dvn*nx;p.vy+=dvn*ny;
o.vr=rnd(-.06,.06);p.vr=rnd(-.06,.06);
}
}
}
}
}

function draw(){
var i,o,sp,c,s;
ctx.setTransform(DPR,0,0,DPR,0,0);
ctx.globalAlpha=1;
ctx.fillStyle='rgba(7,10,20,.28)';
ctx.fillRect(0,0,W,H);
for(i=0;i<objs.length;i++){
o=objs[i];
sp=sprite(o);
c=Math.cos(o.rot)*DPR;s=Math.sin(o.rot)*DPR;
ctx.setTransform(c,s,-s,c,(o.x+(o.g>0?rnd(-3,3):0))*DPR,o.y*DPR);
ctx.globalAlpha=o.alpha;
ctx.drawImage(sp.c,-sp.w/2,-sp.h/2,sp.w,sp.h);
}
ctx.setTransform(DPR,0,0,DPR,0,0);
ctx.globalAlpha=1;
}

var last=performance.now(),slow=0,frames=0;
function frame(t){
var ms=t-last,dt=Math.min(3,ms/16.667);
last=t;
step(dt);draw();
// Adaptive quality: if most frames in a 2s window miss ~40fps, thin out the background.
if(ms<250){frames++;if(ms>25)slow++}
if(frames>=120){
if(slow>frames/2&&objs.length>15){maxObjs=Math.max(15,Math.round(objs.length*.7));objs.length=maxObjs}
frames=slow=0;
}
requestAnimationFrame(frame);
}

window.addEventListener('resize',resize);
window.addEventListener('pointermove',function(e){
mouse.x=e.clientX;mouse.y=e.clientY;
if(reduce)return;
var r=card.getBoundingClientRect();
card.style.setProperty('--mx',((e.clientX-r.left)/r.width*100)+'%');
card.style.setProperty('--my',((e.clientY-r.top)/r.height*100)+'%');
if(card.classList.contains('max')||card.classList.contains('min')){card.style.transform='';return}
card.style.transform='rotateX('+((e.clientY/H-.5)*-8)+'deg) rotateY('+((e.clientX/W-.5)*8)+'deg)';
});
window.addEventListener('pointerleave',function(){mouse.x=mouse.y=-1e4;card.style.transform=''});
window.addEventListener('pointerdown',function(e){
